name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  edge-functions:
    name: Deno tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.cache/jsr
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/deno.json') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Type-check
        working-directory: supabase/functions
        run: deno check _shared/ games/

      - name: Run tests
        working-directory: supabase/functions
        run: deno test --allow-read --allow-env _shared/

      - name: Lint
        working-directory: supabase/functions
        run: deno lint _shared/ games/

  sql-syntax:
    name: SQL migrations syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration files exist
        run: |
          set -e
          ls supabase/migrations/*.sql
          echo "OK"
