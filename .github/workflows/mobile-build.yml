name: Mobile build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + lint + Android APK + iOS/Web compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"

      # Caches dependencies, wrapper and build cache; replaces hand-rolled
      # actions/cache steps for ~/.gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native + Wasm toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            ~/.gradle/nodejs
            ~/.gradle/yarn
          key: ${{ runner.os }}-konan-${{ hashFiles('mobile/gradle/libs.versions.toml') }}

      - name: Unit tests (JVM)
        run: ./gradlew :composeApp:desktopTest

      - name: Android lint + debug APK
        run: ./gradlew :androidApp:lintDebug :androidApp:assembleDebug

      # Klib cross-compilation: type-checks iosMain on Linux without Xcode.
      - name: Compile iOS sources
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      # Full web bundle (Kotlin/Wasm + webpack), so PRs catch what web-deploy
      # would otherwise only hit after merging to main.
      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wortel-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-reports
          path: |
            mobile/composeApp/build/reports/tests/**
            mobile/composeApp/build/test-results/**
            mobile/androidApp/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: ignore
