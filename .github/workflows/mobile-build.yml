name: Mobile build

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/.gradle
          key: ${{ runner.os }}-gradle-mobile-${{ hashFiles('mobile/**/*.gradle*', 'mobile/gradle/**', 'mobile/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-mobile-

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('mobile/gradle/libs.versions.toml') }}

      - name: Run JVM tests
        working-directory: mobile
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: mobile
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wortel-debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            mobile/composeApp/build/reports/tests/**
            mobile/composeApp/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
