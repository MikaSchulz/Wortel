name: Web deploy

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build wasmJs distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK is needed because :composeApp has an Android target, even
      # though this job only builds the web bundle.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin Gradle plugin downloads its own Node.js + Yarn; cache them.
      - name: Cache Kotlin/Wasm toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/nodejs
            ~/.gradle/yarn
          key: ${{ runner.os }}-kotlin-wasm-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/kotlin-js-store/**') }}

      - name: Build wasmJs distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mobile/composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
