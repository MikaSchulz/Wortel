name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip db push (only deploy functions)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_CLI_VERSION: 3.1.0

jobs:
  verify:
    name: Verify (fmt + typecheck + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.lock') }}
      - run: deno task verify

  deploy-db:
    name: Push DB migrations
    needs: verify
    if: ${{ !inputs.skip_migrations }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Runs after the migrations so new code never hits an old schema.
  deploy-functions:
    name: Deploy Edge Functions
    needs: [verify, deploy-db]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy games function
        run: supabase functions deploy games --project-ref "$SUPABASE_PROJECT_REF"
      - name: Set function secrets (idempotent)
        run: |
          supabase secrets set \
            WORTEL_CORS_ALLOWED_ORIGINS="${WORTEL_CORS_ALLOWED_ORIGINS:-*}" \
            --project-ref "$SUPABASE_PROJECT_REF"
        env:
          WORTEL_CORS_ALLOWED_ORIGINS: ${{ secrets.WORTEL_CORS_ALLOWED_ORIGINS }}

  smoke-test:
    name: Smoke test deployed endpoint
    needs: deploy-functions
    runs-on: ubuntu-latest
    steps:
      - name: POST /games (anonymous) + GET /games/daily
        env:
          PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/games"
          RESP=$(curl -sS --fail-with-body -X POST "$BASE" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"wordLength":5,"maxAttempts":6}')
          echo "$RESP"
          echo "$RESP" | grep -q '"id"' || { echo "create smoke test failed"; exit 1; }
          DAILY=$(curl -sS --fail-with-body "$BASE/daily" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}")
          echo "$DAILY"
          echo "$DAILY" | grep -q '"day"' || { echo "daily smoke test failed"; exit 1; }
