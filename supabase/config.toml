# Supabase project configuration.
# Set `project_id` to a unique slug for your project, e.g. the directory name.
project_id = "wortel"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["wortel://auth-callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.games]
verify_jwt = false
# JWT verified inside the function so anonymous play stays possible.
# Set to true to force authenticated access at the gateway level.

[edge_runtime]
enabled = true
policy = "oneshot"
