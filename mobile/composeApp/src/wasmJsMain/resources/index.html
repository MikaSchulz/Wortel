<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121213" />
    <meta name="description" content="Wortel — deutsches Wordle-Spiel." />
    <title>Wortel</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #121213;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #538D4E;
        }
    </style>
</head>
<body>
    <div id="loading">Lade Wortel …</div>
    <script>
        // Compose Multiplatform mounts itself directly on document.body via
        // ComposeViewport, replacing this loading div on first frame.
        window.addEventListener('load', () => {
            // Failsafe: if WASM startup takes >10s show a hint.
            setTimeout(() => {
                const el = document.getElementById('loading');
                if (el && el.isConnected) {
                    el.textContent = 'Lädt noch … Browser oder Netzwerk langsam?';
                }
            }, 10000);
        });
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
