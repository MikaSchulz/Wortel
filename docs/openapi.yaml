openapi: 3.0.3
info:
  title: Wortel API
  version: "1.0.0"
  description: |
    REST API served by the Supabase Edge Function `games`.
    Base URL: `https://<project-ref>.supabase.co/functions/v1/games`
servers:
  - url: https://lmmjbpgfnuxbcdvjtdkm.supabase.co/functions/v1
    description: Supabase Edge Functions (production)
  - url: http://127.0.0.1:54321/functions/v1
    description: Supabase local development
security:
  - bearerAuth: []
  - {}
paths:
  /games:
    post:
      summary: Create a new game
      description: |
        Creates a new game. Send `Authorization: Bearer <supabase-jwt>` to bind the
        game to a user. Without the header the game is anonymous and accessible
        without auth afterwards.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGameResponse'
        '400':
          description: Invalid request (unsupported wordLength, out-of-range maxAttempts)
  /games/{gameId}:
    get:
      summary: Get game state
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '403':
          description: JWT user does not own this game
        '404':
          description: Game not found
  /games/{gameId}/guesses:
    post:
      summary: Submit a guess
      description: |
        Returns 200 with the current game state. If the guess was accepted,
        the state includes the new attempt and updated status. If the guess
        was rejected because the word is unknown or the length is wrong
        (normal gameplay), the state is unchanged and `rejectedGuess` is set.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuessRequest'
      responses:
        '200':
          description: |
            Current game state. Check `rejectedGuess` — when present the
            guess was rejected and state is unchanged; clients should
            indicate this (e.g. shake animation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '403':
          description: JWT user does not own this game
        '404':
          description: Game not found
        '409':
          description: Game is not running (already won or lost)
  /games/daily:
    get:
      summary: Today's daily challenge metadata
      description: |
        Returns metadata about today's shared daily Wordle. Does NOT reveal the secret.
        Lazily generates today's challenge if it doesn't exist yet.
      responses:
        '200':
          description: Daily metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyChallengeMeta'
    post:
      summary: Play today's daily challenge (idempotent)
      description: |
        Returns the user's daily game. If the user has not played yet today, a new
        game is created bound to today's challenge. Subsequent calls return the
        same game so the UI can restore state.

        Anonymous play: send `X-Anonymous-Id: <client-generated-uuid>`. The same
        UUID returns the same game on future calls. Without auth and without the
        header, the request is rejected.
      parameters:
        - in: header
          name: X-Anonymous-Id
          required: false
          schema:
            type: string
            format: uuid
          description: Required for anonymous play; ignored when JWT is present.
      responses:
        '200':
          description: Daily game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPlay'
        '400':
          description: Anonymous play without X-Anonymous-Id
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateGameRequest:
      type: object
      properties:
        wordLength:
          type: integer
          description: desired secret-word length (default 5; supported 5,6,7)
        maxAttempts:
          type: integer
          description: maximum allowed attempts (default 6; range 1..20)
    CreateGameResponse:
      type: object
      required: [id, wordLength, maxAttempts]
      properties:
        id:
          type: string
          format: uuid
        wordLength:
          type: integer
        maxAttempts:
          type: integer
    GuessRequest:
      type: object
      required: [guess]
      properties:
        guess:
          type: string
    GuessResult:
      type: object
      required: [guess, result]
      properties:
        guess:
          type: string
        result:
          type: array
          items:
            type: string
            enum: [CORRECT, PRESENT, ABSENT]
    GameState:
      type: object
      required: [id, status, attempts, remainingAttempts, wordLength, maxAttempts]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [RUNNING, WON, LOST]
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/GuessResult'
        remainingAttempts:
          type: integer
        wordLength:
          type: integer
        maxAttempts:
          type: integer
        secretWord:
          type: string
          nullable: true
          description: revealed only when status is WON or LOST
        rejectedGuess:
          nullable: true
          description: |
            Present when the last submitted guess was rejected (unknown word
            or wrong length). Clients should show a shake / soft cue. State
            is unchanged in this case.
          allOf:
            - $ref: '#/components/schemas/RejectedGuess'
    RejectedGuess:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNKNOWN_WORD, WRONG_LENGTH]
        message:
          type: string
    DailyChallengeMeta:
      type: object
      required: [day, wordLength, maxAttempts]
      properties:
        day:
          type: string
          format: date
          description: ISO date in UTC (YYYY-MM-DD)
        wordLength:
          type: integer
        maxAttempts:
          type: integer
    DailyPlay:
      type: object
      required: [challenge, game, alreadyPlayed]
      properties:
        challenge:
          $ref: '#/components/schemas/DailyChallengeMeta'
        game:
          $ref: '#/components/schemas/GameState'
        alreadyPlayed:
          type: boolean
          description: true if the user had already started today's daily before this call
