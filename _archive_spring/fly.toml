app = "wortel-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"
  # DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD set via `fly secrets set ...`
  # On first deploy, also set: SPRING_JPA_HIBERNATE_DDL_AUTO=update
  # WORTEL_CORS_ALLOWED_ORIGINS = "https://your-app-domain"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
