spring:
  application:
    name: wortel-integration
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:wortel-it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

wortel:
  cors:
    allowed-origins: "*"
