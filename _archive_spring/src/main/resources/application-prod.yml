spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

# Flyway/Liquibase migrations should be added before going to prod with ddl-auto=validate.
# For now, run with SPRING_JPA_HIBERNATE_DDL_AUTO=update on first deploy to bootstrap schema.

wortel:
  cors:
    allowed-origins: ${WORTEL_CORS_ALLOWED_ORIGINS:}
