spring:
  application:
    name: wortel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

wortel:
  cors:
    allowed-origins: ${WORTEL_CORS_ALLOWED_ORIGINS:*}
